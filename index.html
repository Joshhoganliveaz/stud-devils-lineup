<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stud Devils — Game Day Lineup</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #000;
            background: #fff;
            padding: 16px;
            margin: 0 auto;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 3px solid #000;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 24px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.06em;
            margin-bottom: 4px;
        }
        .header p { font-size: 12px; color: #444; }

        /* Inning navigation */
        .inning-nav {
            display: flex; justify-content: center; gap: 6px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .inning-btn {
            padding: 10px 16px;
            font-size: 14px; font-weight: 700;
            border: 2px solid #000;
            background: #fff;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            transition: all 0.15s;
            border-radius: 4px;
            min-width: 48px;
        }
        .inning-btn:hover { background: #eee; }
        .inning-btn.active {
            background: #1a5e1a; color: #fff; border-color: #1a5e1a;
        }

        /* Diamond wrapper scales on mobile */
        .diamond-wrapper {
            width: 100%;
            max-width: 700px;
            margin: 0 auto 20px;
        }
        .diamond-container {
            position: relative;
            width: 100%;
            padding-bottom: 88.57%; /* 620/700 aspect ratio */
        }
        .diamond-inner {
            position: absolute;
            top: 0; left: 0;
            width: 700px; height: 620px;
            transform-origin: top left;
        }

        /* Field background */
        .outfield-grass {
            position: absolute;
            width: 660px; height: 360px;
            top: 0; left: 20px;
            background: #2d7a2d;
            border-radius: 330px 330px 0 0;
        }
        .infield-dirt {
            position: absolute;
            width: 240px; height: 240px;
            top: 230px; left: 230px;
            background: #c4956a;
            transform: rotate(45deg);
            border-radius: 8px;
        }
        .infield-grass {
            position: absolute;
            width: 140px; height: 140px;
            top: 280px; left: 280px;
            background: #2d7a2d;
            transform: rotate(45deg);
            border-radius: 6px;
        }
        .mound {
            position: absolute;
            width: 36px; height: 36px;
            top: 332px; left: 332px;
            background: #c4956a;
            border-radius: 50%;
        }
        .home-dirt {
            position: absolute;
            width: 80px; height: 80px;
            top: 480px; left: 310px;
            background: #c4956a;
            border-radius: 50%;
        }

        /* Player positions */
        .pos {
            position: absolute;
            text-align: center;
            z-index: 10;
        }
        .pos-label {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #fff;
            background: rgba(0,0,0,0.5);
            padding: 1px 6px;
            border-radius: 3px;
            margin-bottom: 3px;
            display: block;
        }
        .pos-name {
            font-size: 15px; font-weight: 700;
            color: #fff;
            background: #1a5e1a;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            white-space: nowrap;
            border: 2px solid rgba(255,255,255,0.4);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .pos-name.infield {
            background: #8B4513;
        }

        /* Position placements */
        .pos-p   { top: 310px; left: 350px; transform: translateX(-50%); }
        .pos-c   { top: 510px; left: 350px; transform: translateX(-50%); }
        .pos-1b  { top: 340px; left: 510px; transform: translateX(-50%); }
        .pos-2b  { top: 255px; left: 445px; transform: translateX(-50%); }
        .pos-3b  { top: 340px; left: 190px; transform: translateX(-50%); }
        .pos-ss  { top: 255px; left: 255px; transform: translateX(-50%); }
        .pos-lf  { top: 100px; left: 90px;  transform: translateX(-50%); }
        .pos-lcf { top: 30px;  left: 240px; transform: translateX(-50%); }
        .pos-rcf { top: 30px;  left: 460px; transform: translateX(-50%); }
        .pos-rf  { top: 100px; left: 610px; transform: translateX(-50%); }

        /* Bench */
        .bench-section {
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 10px 16px;
            text-align: center;
            max-width: 700px;
            margin: 0 auto 20px;
        }
        .bench-section h3 {
            font-size: 12px; font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #666;
            margin-bottom: 6px;
        }
        .bench-names {
            font-size: 15px; font-weight: 700;
            color: #444;
        }

        /* Grid table */
        .grid-section {
            max-width: 900px;
            margin: 0 auto;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .grid-section h2 {
            font-size: 14px; font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 8px;
            text-align: center;
        }
        .grid-table {
            width: 100%; border-collapse: collapse; margin-bottom: 16px;
            min-width: 480px;
        }
        .grid-table th {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.04em; text-align: center;
            padding: 6px 4px; border-bottom: 2px solid #000;
            background: #f5f5f5;
            position: sticky; top: 0;
        }
        .grid-table td {
            font-size: 12px; padding: 5px 4px; border-bottom: 1px solid #ddd;
            text-align: center;
        }
        .grid-table td:first-child {
            font-weight: 700; text-align: left;
            position: sticky; left: 0;
            background: #fff;
            z-index: 1;
            padding-left: 8px;
            padding-right: 8px;
        }
        .grid-table tr:last-child td {
            border-bottom: 2px solid #000;
        }
        .grid-table .bench-cell {
            color: #999; font-style: italic;
        }
        .grid-table .highlight-col {
            background: #e8f5e8;
        }
        .grid-table .highlight-col:first-child {
            background: #e8f5e8;
        }
        .grid-table .p1b-cell {
            font-weight: 700; color: #8B4513;
        }

        .footer {
            text-align: center; padding-top: 8px; margin-top: 20px;
            border-top: 1px solid #ccc;
        }
        .footer p { font-size: 10px; color: #666; }

        /* Swipe hint */
        .swipe-hint {
            display: none;
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-bottom: 8px;
        }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .header h1 { font-size: 18px; }
            .header p { font-size: 11px; }
            .inning-btn {
                padding: 8px 10px;
                font-size: 13px;
                min-width: 42px;
            }
            .inning-nav { gap: 4px; }
            .pos-name { font-size: 12px; padding: 3px 6px; }
            .pos-label { font-size: 8px; padding: 1px 4px; }
            .bench-names { font-size: 13px; }
            .swipe-hint { display: block; }
        }

        @media print {
            body { padding: 0.5in; }
            .inning-nav { display: none; }
            .swipe-hint { display: none; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>Stud Devils Game Day Lineup</h1>
        <p>6 Innings &bull; 13 Players &bull; 10 Fielders &bull; 3 Bench Per Inning</p>
    </header>

    <!-- Inning Selector -->
    <div class="inning-nav">
        <button class="inning-btn active" onclick="showInning(1)">Inn 1</button>
        <button class="inning-btn" onclick="showInning(2)">Inn 2</button>
        <button class="inning-btn" onclick="showInning(3)">Inn 3</button>
        <button class="inning-btn" onclick="showInning(4)">Inn 4</button>
        <button class="inning-btn" onclick="showInning(5)">Inn 5</button>
        <button class="inning-btn" onclick="showInning(6)">Inn 6</button>
    </div>

    <!-- Baseball Diamond -->
    <div class="diamond-wrapper">
        <div class="diamond-container">
            <div class="diamond-inner" id="diamond-inner">
                <div class="outfield-grass"></div>
                <div class="infield-dirt"></div>
                <div class="infield-grass"></div>
                <div class="mound"></div>
                <div class="home-dirt"></div>

                <div class="pos pos-p">
                    <span class="pos-label">P</span>
                    <span class="pos-name infield" id="pos-p"></span>
                </div>
                <div class="pos pos-c">
                    <span class="pos-label">C</span>
                    <span class="pos-name infield" id="pos-c"></span>
                </div>
                <div class="pos pos-1b">
                    <span class="pos-label">1B</span>
                    <span class="pos-name infield" id="pos-1b"></span>
                </div>
                <div class="pos pos-2b">
                    <span class="pos-label">2B</span>
                    <span class="pos-name infield" id="pos-2b"></span>
                </div>
                <div class="pos pos-3b">
                    <span class="pos-label">3B</span>
                    <span class="pos-name infield" id="pos-3b"></span>
                </div>
                <div class="pos pos-ss">
                    <span class="pos-label">SS</span>
                    <span class="pos-name infield" id="pos-ss"></span>
                </div>
                <div class="pos pos-lf">
                    <span class="pos-label">LF</span>
                    <span class="pos-name" id="pos-lf"></span>
                </div>
                <div class="pos pos-lcf">
                    <span class="pos-label">LC</span>
                    <span class="pos-name" id="pos-lcf"></span>
                </div>
                <div class="pos pos-rcf">
                    <span class="pos-label">RC</span>
                    <span class="pos-name" id="pos-rcf"></span>
                </div>
                <div class="pos pos-rf">
                    <span class="pos-label">RF</span>
                    <span class="pos-name" id="pos-rf"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bench -->
    <div class="bench-section">
        <h3>Bench</h3>
        <div class="bench-names" id="bench-names"></div>
    </div>

    <!-- Full Grid Table -->
    <div class="grid-section">
        <h2>Full Position Grid</h2>
        <p class="swipe-hint">Swipe to scroll table</p>
        <table class="grid-table" id="grid-table">
            <thead>
                <tr>
                    <th>Player</th>
                    <th>Inn 1</th>
                    <th>Inn 2</th>
                    <th>Inn 3</th>
                    <th>Inn 4</th>
                    <th>Inn 5</th>
                    <th>Inn 6</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <footer class="footer">
        <p>Stud Devils &bull; Game Day Lineup</p>
    </footer>

    <script>
        const lineup = {
            "Theo":    ["RF","C","LF","B","3B","B"],
            "Cruz":    ["B","2B","SS","LC","P","P"],
            "Maddox":  ["3B","B","1B","RC","1B","SS"],
            "Kai":     ["1B","1B","LC","B","SS","LC"],
            "Donovan": ["SS","LC","B","1B","LC","1B"],
            "Diego":   ["P","P","RC","SS","B","2B"],
            "Emmett":  ["LC","B","P","P","RC","3B"],
            "Jacob":   ["B","RF","RF","C","B","RF"],
            "Juli":    ["LF","LF","3B","B","RF","B"],
            "Julian":  ["2B","SS","B","LF","2B","RC"],
            "Bruce":   ["RC","B","2B","2B","LF","B"],
            "Michael": ["C","3B","B","RF","C","C"],
            "Remy":    ["B","RC","C","3B","B","LF"]
        };

        const posMap = {
            "P": "pos-p", "C": "pos-c", "1B": "pos-1b", "2B": "pos-2b",
            "3B": "pos-3b", "SS": "pos-ss", "LF": "pos-lf", "LC": "pos-lcf",
            "RC": "pos-rcf", "RF": "pos-rf"
        };

        const p1bPositions = ["P", "1B"];

        function scaleDiamond() {
            const wrapper = document.querySelector('.diamond-wrapper');
            const inner = document.getElementById('diamond-inner');
            const wrapperWidth = wrapper.clientWidth;
            const scale = Math.min(wrapperWidth / 700, 1);
            inner.style.transform = 'scale(' + scale + ')';
        }

        function showInning(inn) {
            // Update buttons
            document.querySelectorAll('.inning-btn').forEach(function(btn, i) {
                btn.classList.toggle('active', i + 1 === inn);
            });

            // Clear positions
            Object.values(posMap).forEach(function(id) {
                document.getElementById(id).textContent = '';
            });

            var benchPlayers = [];
            var idx = inn - 1;

            for (var name in lineup) {
                var pos = lineup[name][idx];
                if (pos === "B") {
                    benchPlayers.push(name);
                } else {
                    var elId = posMap[pos];
                    if (elId) {
                        document.getElementById(elId).textContent = name;
                    }
                }
            }

            document.getElementById('bench-names').textContent = benchPlayers.join('  /  ');
            buildGrid(inn);
        }

        function buildGrid(activeInn) {
            var tbody = document.querySelector('#grid-table tbody');
            tbody.innerHTML = '';

            for (var name in lineup) {
                var positions = lineup[name];
                var tr = document.createElement('tr');
                var nameTd = document.createElement('td');
                nameTd.textContent = name;
                tr.appendChild(nameTd);

                for (var i = 0; i < positions.length; i++) {
                    var td = document.createElement('td');
                    var pos = positions[i];
                    td.textContent = pos;
                    if (pos === 'B') td.className = 'bench-cell';
                    if (p1bPositions.indexOf(pos) !== -1) td.className = 'p1b-cell';
                    if (i + 1 === activeInn) td.classList.add('highlight-col');
                    tr.appendChild(td);
                }

                tbody.appendChild(tr);
            }
        }

        // Swipe between innings on diamond
        (function() {
            var startX = 0;
            var currentInning = 1;
            var diamond = document.querySelector('.diamond-wrapper');

            diamond.addEventListener('touchstart', function(e) {
                startX = e.touches[0].clientX;
            }, { passive: true });

            diamond.addEventListener('touchend', function(e) {
                var diff = startX - e.changedTouches[0].clientX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0 && currentInning < 6) {
                        currentInning++;
                    } else if (diff < 0 && currentInning > 1) {
                        currentInning--;
                    }
                    showInning(currentInning);
                }
            }, { passive: true });

            // Expose for button clicks
            var origShow = showInning;
            window.showInning = function(inn) {
                currentInning = inn;
                origShow(inn);
            };
        })();

        // Scale and init
        scaleDiamond();
        window.addEventListener('resize', scaleDiamond);
        showInning(1);
    </script>

</body>
</html>
